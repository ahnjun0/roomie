<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Dormitory Selection</title>
<!-- Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Spline+Sans:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Configuration -->
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#13b6ec",
              "background-light": "#f6f8f8",
              "background-dark": "#101d22",
              "surface-dark": "#111e22",
              "border-dark": "#325a67",
            },
            fontFamily: {
              "display": ["Spline Sans", "sans-serif"],
              "body": ["Noto Sans", "sans-serif"],
            },
            borderRadius: {
                "DEFAULT": "0.25rem", 
                "lg": "0.5rem", 
                "xl": "0.75rem", 
                "full": "9999px"
            },
          },
        },
      }
    </script>
<style>
        /* Custom scrollbar for clean look */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #101d22; 
        }
        ::-webkit-scrollbar-thumb {
            background: #325a67; 
            border-radius: 3px;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-white font-display antialiased overflow-x-hidden">
<div class="relative flex min-h-screen w-full flex-col max-w-md mx-auto shadow-2xl overflow-hidden bg-background-light dark:bg-background-dark">
<!-- Header -->
<header class="flex items-center justify-between p-4 pb-2">
<button class="flex size-10 items-center justify-center rounded-full hover:bg-slate-200 dark:hover:bg-white/10 transition-colors text-slate-900 dark:text-white">
<span class="material-symbols-outlined">arrow_back_ios_new</span>
</button>
<div class="text-xs font-medium text-slate-500 dark:text-slate-400">Step 3 of 5</div>
<div class="size-10"></div> <!-- Spacer for balance -->
</header>
<!-- Progress Bar -->
<div class="px-6 mb-6">
<div class="h-1.5 w-full rounded-full bg-slate-200 dark:bg-surface-dark overflow-hidden">
<div class="h-full bg-primary rounded-full" style="width: 60%;"></div>
</div>
</div>
<!-- Main Content -->
<main class="flex-1 flex flex-col px-6">
<!-- Headline -->
<div class="mb-2">
<h1 class="text-2xl md:text-3xl font-bold tracking-tight leading-tight text-slate-900 dark:text-white">
                    Which dorms did you<br/>apply for?
                </h1>
</div>
<!-- Body Text -->
<div class="mb-8">
<p class="text-base text-slate-600 dark:text-slate-400 font-normal leading-relaxed">
                    Please select all the dormitories you applied for. You can choose more than one.
                </p>
</div>
<!-- Selection List -->
<div class="flex flex-col gap-3">
<!-- Option 1: Sungsil Hall -->
<label class="group relative cursor-pointer">
<input class="peer sr-only" name="dorm" type="checkbox" value="sungsil"/>
<div class="flex items-center justify-between rounded-xl border border-slate-200 dark:border-border-dark bg-white dark:bg-surface-dark p-4 transition-all duration-200 peer-checked:border-primary peer-checked:bg-primary/5 dark:peer-checked:bg-primary/10 peer-checked:shadow-sm">
<div class="flex items-center gap-4">
<div class="flex size-10 items-center justify-center rounded-lg bg-slate-100 dark:bg-[#1a2c32] text-slate-400 dark:text-slate-400 peer-checked:text-primary transition-colors group-hover:text-primary">
<span class="material-symbols-outlined">apartment</span>
</div>
<span class="font-medium text-slate-900 dark:text-white text-lg">Sungsil Hall</span>
</div>
<div class="size-6 rounded-full border-2 border-slate-300 dark:border-border-dark flex items-center justify-center peer-checked:border-primary peer-checked:bg-primary transition-colors">
<span class="material-symbols-outlined text-white text-[16px] opacity-0 peer-checked:opacity-100 scale-50 peer-checked:scale-100 transition-all duration-200">check</span>
</div>
</div>
<!-- Custom styled overlay for the checked state to target sibling elements -->
<div class="absolute inset-0 rounded-xl ring-2 ring-primary ring-opacity-0 transition-all peer-checked:ring-opacity-100 pointer-events-none"></div>
</label>
<!-- Option 2: Bongsa Hall -->
<label class="group relative cursor-pointer">
<input checked="" class="peer sr-only" name="dorm" type="checkbox" value="bongsa"/>
<div class="flex items-center justify-between rounded-xl border border-slate-200 dark:border-border-dark bg-white dark:bg-surface-dark p-4 transition-all duration-200 peer-checked:border-primary peer-checked:bg-primary/5 dark:peer-checked:bg-primary/10 peer-checked:shadow-sm">
<div class="flex items-center gap-4">
<div class="flex size-10 items-center justify-center rounded-lg bg-slate-100 dark:bg-[#1a2c32] text-slate-400 dark:text-slate-400 peer-checked:text-primary transition-colors group-hover:text-primary">
<span class="material-symbols-outlined">meeting_room</span>
</div>
<span class="font-medium text-slate-900 dark:text-white text-lg">Bongsa Hall</span>
</div>
<div class="size-6 rounded-full border-2 border-slate-300 dark:border-border-dark flex items-center justify-center bg-transparent peer-checked:border-primary peer-checked:bg-primary transition-colors">
<span class="material-symbols-outlined text-white text-[16px] opacity-0 peer-checked:opacity-100 scale-50 peer-checked:scale-100 transition-all duration-200">check</span>
</div>
</div>
<div class="absolute inset-0 rounded-xl ring-2 ring-primary ring-opacity-0 transition-all peer-checked:ring-opacity-100 pointer-events-none"></div>
</label>
<!-- Option 3: Jinri Hall -->
<label class="group relative cursor-pointer">
<input class="peer sr-only" name="dorm" type="checkbox" value="jinri"/>
<div class="flex items-center justify-between rounded-xl border border-slate-200 dark:border-border-dark bg-white dark:bg-surface-dark p-4 transition-all duration-200 peer-checked:border-primary peer-checked:bg-primary/5 dark:peer-checked:bg-primary/10 peer-checked:shadow-sm">
<div class="flex items-center gap-4">
<div class="flex size-10 items-center justify-center rounded-lg bg-slate-100 dark:bg-[#1a2c32] text-slate-400 dark:text-slate-400 peer-checked:text-primary transition-colors group-hover:text-primary">
<span class="material-symbols-outlined">menu_book</span>
</div>
<span class="font-medium text-slate-900 dark:text-white text-lg">Jinri Hall</span>
</div>
<div class="size-6 rounded-full border-2 border-slate-300 dark:border-border-dark flex items-center justify-center peer-checked:border-primary peer-checked:bg-primary transition-colors">
<span class="material-symbols-outlined text-white text-[16px] opacity-0 peer-checked:opacity-100 scale-50 peer-checked:scale-100 transition-all duration-200">check</span>
</div>
</div>
<div class="absolute inset-0 rounded-xl ring-2 ring-primary ring-opacity-0 transition-all peer-checked:ring-opacity-100 pointer-events-none"></div>
</label>
<!-- Option 4: Hwawon Hall -->
<label class="group relative cursor-pointer">
<input class="peer sr-only" name="dorm" type="checkbox" value="hwawon"/>
<div class="flex items-center justify-between rounded-xl border border-slate-200 dark:border-border-dark bg-white dark:bg-surface-dark p-4 transition-all duration-200 peer-checked:border-primary peer-checked:bg-primary/5 dark:peer-checked:bg-primary/10 peer-checked:shadow-sm">
<div class="flex items-center gap-4">
<div class="flex size-10 items-center justify-center rounded-lg bg-slate-100 dark:bg-[#1a2c32] text-slate-400 dark:text-slate-400 peer-checked:text-primary transition-colors group-hover:text-primary">
<span class="material-symbols-outlined">local_florist</span>
</div>
<span class="font-medium text-slate-900 dark:text-white text-lg">Hwawon Hall</span>
</div>
<div class="size-6 rounded-full border-2 border-slate-300 dark:border-border-dark flex items-center justify-center peer-checked:border-primary peer-checked:bg-primary transition-colors">
<span class="material-symbols-outlined text-white text-[16px] opacity-0 peer-checked:opacity-100 scale-50 peer-checked:scale-100 transition-all duration-200">check</span>
</div>
</div>
<div class="absolute inset-0 rounded-xl ring-2 ring-primary ring-opacity-0 transition-all peer-checked:ring-opacity-100 pointer-events-none"></div>
</label>
</div>
</main>
<!-- Footer / Action Button -->
<footer class="p-6 mt-auto">
<button class="w-full rounded-xl bg-primary py-4 text-center text-base font-bold text-white shadow-lg shadow-primary/25 transition-transform active:scale-[0.98] hover:bg-primary/90 focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 dark:focus:ring-offset-background-dark">
                Next
            </button>
</footer>
<!-- Spacer for iPhone bottom bar area if needed, though padding above handles it usually -->
<div class="h-4 w-full bg-background-light dark:bg-background-dark"></div>
</div>
</body></html>
