name: Docker CI/CD with GHCR

on:
  push:
    branches: [ main ] # 메인 브랜치 푸시 시 작동
    paths:
      - 'apps/api/**'          # apps/api 폴더 하위의 모든 변경사항
      - 'docker-compose.yml'   # 배포 설정이 바뀌었을 때도 동작해야 함
      - '.github/workflows/**' # CI/CD 스크립트 자체가 바뀌었을 때도 동작 권장

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Images
        run: |
          # yml에 적힌 image 이름을 기준으로 빌드하고 푸시합니다.
          docker compose build
          docker compose push

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: SSH into EC2 and Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/app
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            echo "${{ secrets.ENV_FILE }}" > .env

            # [수정] 모든 docker-compose를 'docker compose' (하이픈 없이)로 바꿉니다.
            docker compose pull
            docker compose up -d --no-build

            # 컨테이너가 시작될 때까지 대기
            # sleep 5

            # DB 마이그레이션과 제너레이션은 이미 컨테이너가 뜨면서 스스로 처리합니다. (Dockerfile 수정 완료)
            # 2. [추가] DB 스키마 업데이트 (migrate deploy)
            # echo "Running DB migrations..."
            # docker exec roomie-api python -m prisma migrate deploy

            # 3. [추가] Prisma Client 재생성
            # echo "Generating Prisma Client..."
            # docker exec roomie-api python -m prisma generate

            # 학교/기숙사 초기 데이터 seed (멱등성 보장 - 이미 있는 데이터는 skip)
            docker exec roomie-api python -m scripts.seeds

            docker image prune -f
